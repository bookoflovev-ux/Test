<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FF5E5B">
<meta name="description" content="Bric-à-Blocs — jeux éducatifs interactifs pour enfants de 3 à 12 ans : construction en blocs, chasse aux objets, calcul, mots, memory et quiz.">
<title>🧱 Bric-à-Blocs — Jeux éducatifs 3-12 ans</title>
<style>
  :root{
    /* Palette « briques de jouet » */
    --paper:#FFF4E4;
    --ink:#241B4D;          /* indigo-noir choisi */
    --ink-soft:#6B6390;
    --card:#FFFFFF;
    --r:#FF5E5B; --o:#FF9F1C; --y:#FFCA3A; --g:#22C3AE;
    --b:#3FC0F0; --p:#8A4FEC; --pink:#FF4D9D;
    --border:3px solid var(--ink);
    --shadow:0 6px 0 var(--ink);
    --shadow-lg:0 9px 0 var(--ink);
    --radius:20px;

    /* alias pour compat des générateurs */
    --violet:var(--p); --vert:var(--g); --rose:var(--pink); --sombre:var(--ink);
    --rouge:var(--r); --bleu:var(--b); --jaune:var(--y); --orange:var(--o); --turquoise:var(--g);
    --ombre:var(--shadow);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"Nunito","Baloo 2","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
    color:var(--ink);
    background-color:var(--paper);
    background-image:radial-gradient(rgba(36,27,77,.10) 2px, transparent 2px);
    background-size:28px 28px; background-position:-6px -6px;
    min-height:100vh;overflow-x:hidden;
    display:flex;flex-direction:column;
    user-select:none;-webkit-user-select:none;
  }
  #app{flex:1;display:flex;flex-direction:column;max-width:940px;margin:0 auto;width:100%;padding:16px 16px 8px}
  .screen{animation:pop .35s cubic-bezier(.2,1.2,.4,1)}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}

  /* ---- Brique générique (bouton physique) ---- */
  .brick{
    background:var(--card);border:var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);transition:transform .08s, box-shadow .08s;cursor:pointer;
  }
  .brick:active{transform:translateY(6px);box-shadow:0 0 0 var(--ink)}

  /* ---- Barre du haut (établi) ---- */
  header.bar{
    display:flex;align-items:center;gap:10px;margin-bottom:16px;
    background:var(--card);border:var(--border);border-radius:22px;box-shadow:var(--shadow);
    padding:8px 10px;flex-wrap:wrap;
  }
  .bar .home-btn{
    background:var(--r);color:#fff;border:var(--border);border-radius:15px;
    font-size:22px;font-weight:900;padding:6px 14px;cursor:pointer;box-shadow:0 4px 0 var(--ink);
  }
  .bar .home-btn:active{transform:translateY(4px);box-shadow:none}
  .bar .spacer{flex:1}
  .pill{
    display:inline-flex;align-items:center;gap:6px;border:var(--border);border-radius:15px;
    padding:6px 12px;font-weight:900;font-size:16px;background:var(--y);cursor:pointer;
    box-shadow:0 4px 0 var(--ink);
  }
  .pill:active{transform:translateY(4px);box-shadow:none}
  .pill.stars{background:var(--card)}
  .pill.avatar{background:var(--b);font-size:22px;padding:4px 12px}

  /* ---- Titres ---- */
  h1.logo{text-align:center;font-size:clamp(30px,8vw,52px);font-weight:900;line-height:1;
    letter-spacing:-1px;margin:10px 0 6px;
    text-shadow:3px 3px 0 var(--y),6px 6px 0 var(--ink)}
  .subtitle{text-align:center;font-weight:800;color:var(--ink-soft);margin-bottom:18px;font-size:clamp(15px,3.6vw,19px)}
  h2.q{text-align:center;font-size:clamp(20px,5.2vw,30px);font-weight:900;margin:4px 0 16px;text-wrap:balance}
  .eyebrow{display:block;text-align:center;text-transform:uppercase;letter-spacing:3px;
    font-weight:900;font-size:13px;color:var(--ink-soft);margin-bottom:2px}

  /* ---- Grilles ---- */
  .grid{display:grid;gap:14px}
  .cols-2{grid-template-columns:repeat(2,1fr)}
  .cols-3{grid-template-columns:repeat(3,1fr)}
  .cols-4{grid-template-columns:repeat(4,1fr)}

  /* ---- Écran d'accueil ---- */
  .hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:14px 0}
  .mascot{font-size:clamp(80px,26vw,150px);line-height:1;animation:wobble 2.6s ease-in-out infinite;filter:drop-shadow(0 10px 0 rgba(36,27,77,.15))}
  @keyframes wobble{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
  .cta{
    background:var(--g);color:#fff;border:var(--border);border-radius:22px;
    font-size:clamp(22px,6vw,30px);font-weight:900;padding:18px 40px;cursor:pointer;
    box-shadow:var(--shadow-lg);margin-top:6px;
  }
  .cta:active{transform:translateY(9px);box-shadow:0 0 0 var(--ink)}

  /* ---- Avatars & âges ---- */
  .pickgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(74px,1fr))}
  .pick{
    aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    font-size:clamp(30px,9vw,44px);border:var(--border);border-radius:18px;cursor:pointer;
    background:var(--card);box-shadow:var(--shadow);transition:transform .08s,box-shadow .08s;
  }
  .pick:active{transform:translateY(6px);box-shadow:0 0 0 var(--ink)}
  .pick.sel{background:var(--y);transform:rotate(-3deg)}
  .age-grid{grid-template-columns:repeat(5,1fr)}
  .age-btn{
    aspect-ratio:1;border:var(--border);border-radius:20px;cursor:pointer;color:#fff;
    font-size:clamp(24px,6.5vw,38px);font-weight:900;display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow);transition:transform .08s,box-shadow .08s;
  }
  .age-btn:active{transform:translateY(6px);box-shadow:0 0 0 var(--ink)}
  .age-btn:nth-child(6n+1){background:var(--r)} .age-btn:nth-child(6n+2){background:var(--b)}
  .age-btn:nth-child(6n+3){background:var(--g)} .age-btn:nth-child(6n+4){background:var(--o)}
  .age-btn:nth-child(6n+5){background:var(--p)} .age-btn:nth-child(6n){background:var(--pink)}

  /* ---- Tuiles de jeux ---- */
  .game-btn{
    border:var(--border);border-radius:24px;cursor:pointer;padding:16px 10px;color:#fff;
    display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;
    font-weight:900;font-size:clamp(14px,3.6vw,18px);box-shadow:var(--shadow);
    transition:transform .08s,box-shadow .08s;min-height:132px;justify-content:center;
  }
  .game-btn .emoji{font-size:clamp(40px,10vw,54px);line-height:1;filter:drop-shadow(0 3px 0 rgba(36,27,77,.25))}
  .game-btn small{font-weight:800;opacity:.95;font-size:12px}
  .game-btn:active{transform:translateY(6px);box-shadow:0 0 0 var(--ink)}

  /* ---- QCM ---- */
  .options{display:grid;gap:14px;margin-top:4px}
  .opt{
    border:var(--border);border-radius:20px;cursor:pointer;background:var(--card);color:var(--ink);
    font-size:clamp(22px,6vw,32px);font-weight:900;padding:20px 10px;box-shadow:var(--shadow);
    transition:transform .08s,box-shadow .08s;min-height:74px;
  }
  .opt.small{font-size:clamp(17px,4.4vw,22px)}
  .opt:active{transform:translateY(6px);box-shadow:0 0 0 var(--ink)}
  .opt.good{background:var(--g)!important;color:#fff;animation:goodPulse .5s}
  .opt.bad{background:var(--r)!important;color:#fff;animation:shake .4s}
  @keyframes goodPulse{0%{transform:scale(1)}50%{transform:scale(1.07)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

  .big-emoji{font-size:clamp(70px,22vw,120px);text-align:center;line-height:1;margin:6px 0 12px}
  .prompt-box{background:var(--card);border:var(--border);border-radius:22px;padding:18px;text-align:center;box-shadow:var(--shadow);margin-bottom:16px}
  .prompt-box .txt{font-size:clamp(26px,7vw,44px);font-weight:900;letter-spacing:2px;font-variant-numeric:tabular-nums}

  .progress{height:16px;background:var(--card);border:var(--border);border-radius:12px;overflow:hidden;margin:2px 0 16px}
  .progress > span{display:block;height:100%;background:var(--g);width:0;transition:width .4s}

  /* ---- Chasse aux objets ---- */
  .hunt-item{
    display:flex;align-items:center;gap:12px;background:var(--card);border:var(--border);border-radius:18px;
    padding:11px 14px;box-shadow:0 4px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s;
  }
  .hunt-item:active{transform:translateY(4px);box-shadow:none}
  .hunt-item .he{font-size:34px}
  .hunt-item .hn{font-weight:800;font-size:clamp(15px,4vw,19px);flex:1}
  .hunt-item .check{width:34px;height:34px;border-radius:10px;border:var(--border);display:flex;align-items:center;justify-content:center;font-size:20px;color:transparent}
  .hunt-item.found{background:#DFFBF3}
  .hunt-item.found .check{background:var(--g);color:#fff}
  .hunt-item.found .hn{text-decoration:line-through;opacity:.55}

  /* ---- Memory ---- */
  .mem-grid{display:grid;gap:10px}
  .mem-card{
    aspect-ratio:1;border:var(--border);border-radius:18px;cursor:pointer;
    font-size:clamp(28px,9vw,46px);display:flex;align-items:center;justify-content:center;
    background:var(--p);color:#fff;box-shadow:var(--shadow);transition:transform .12s,box-shadow .08s;
  }
  .mem-card:active{transform:translateY(4px)}
  .mem-card.up{background:var(--card);color:var(--ink);animation:goodPulse .3s}
  .mem-card.matched{background:#DFFBF3;border-color:var(--g);box-shadow:0 4px 0 var(--g);opacity:.85}

  /* ---- Construction ---- */
  .build-wrap{display:flex;flex-direction:column;gap:12px}
  .build-grid{display:grid;gap:3px;background:var(--ink);border:var(--border);border-radius:16px;padding:6px;box-shadow:var(--shadow);width:100%;aspect-ratio:var(--ar,1)}
  .bcell{border-radius:6px;background:rgba(255,255,255,.06);cursor:pointer;transition:transform .05s}
  .bcell:active{transform:scale(.86)}
  .bcell.ghost{opacity:.22}
  .bcell.block{box-shadow:inset 0 -5px 0 rgba(0,0,0,.20), inset 0 3px 0 rgba(255,255,255,.30)}
  .mini{display:grid;gap:1px;width:74px;height:74px;background:var(--ink);border:2px solid var(--ink);border-radius:8px;padding:2px;flex:none}
  .mini i{border-radius:1px;display:block}
  .palette{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .swatch{width:44px;height:44px;border:var(--border);border-radius:12px;cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
  .swatch:active{transform:translateY(4px);box-shadow:none}
  .swatch.sel{transform:translateY(-3px) rotate(-6deg);box-shadow:0 7px 0 var(--ink)}
  .swatch.tool{background:var(--card);display:flex;align-items:center;justify-content:center;font-size:22px}

  /* ---- Divers ---- */
  .feedback{text-align:center;font-size:clamp(22px,6vw,32px);font-weight:900;min-height:40px;margin-top:12px}
  .card{background:var(--card);border:var(--border);border-radius:26px;box-shadow:var(--shadow-lg);padding:22px}
  .btn-primary{
    display:block;width:100%;border:var(--border);border-radius:20px;background:var(--y);color:var(--ink);
    font-size:clamp(18px,5vw,24px);font-weight:900;padding:16px;cursor:pointer;box-shadow:var(--shadow);margin-top:12px;
    transition:transform .08s,box-shadow .08s;
  }
  .btn-primary:active{transform:translateY(6px);box-shadow:0 0 0 var(--ink)}
  .btn-ghost{background:var(--card)}
  .btn-green{background:var(--g);color:#fff}
  .center{text-align:center}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .chip{background:var(--card);border:var(--border);border-radius:15px;padding:10px 16px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 var(--ink);font-size:15px;transition:transform .08s,box-shadow .08s}
  .chip.active{background:var(--y)}
  .chip:active{transform:translateY(4px);box-shadow:none}

  #confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
  .confetti-piece{position:absolute;top:-30px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}

  footer{text-align:center;color:var(--ink-soft);font-weight:800;font-size:12px;padding:14px}

  @media(prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
  @media(max-width:430px){
    .age-grid{grid-template-columns:repeat(4,1fr)}
    #app{padding:12px}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="confetti"></div>
<footer>🧱 Bric-à-Blocs · Fait avec ❤️ pour les enfants curieux</footer>

<script>
/* =====================================================================
   BRIC-À-BLOCS — jeu éducatif 3-12 ans
   Un seul fichier, aucune dépendance, fonctionne hors-ligne.
   ===================================================================== */
const app = document.getElementById('app');

const state = { avatar:null, age:null, stars:0, streak:0, game:null };

/* ---------- utilitaires ---------- */
const rand=(n)=>Math.floor(Math.random()*n);
const randInt=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=(a)=>a[rand(a.length)];
const shuffle=(a)=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const sample=(a,n)=>shuffle(a).slice(0,n);
const tier=(age)=>age<=5?'petit':age<=8?'moyen':'grand';

/* ---------- sons (Web Audio) ---------- */
let actx;
function beep(freqs,dur=0.12,type='sine'){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    let t=actx.currentTime;
    freqs.forEach(f=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type=type;o.frequency.value=f;o.connect(g);g.connect(actx.destination);
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.25,t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.start(t);o.stop(t+dur);t+=dur*0.9;
    });
  }catch(e){}
}
const sndGood=()=>beep([523,659,784],0.12,'triangle');
const sndWin =()=>beep([523,659,784,1046],0.15,'triangle');
const sndBad =()=>beep([200,150],0.17,'sawtooth');
const sndClick=()=>beep([440],0.05,'square');
const sndPlace=()=>beep([330,494],0.06,'square');

/* ---------- confetti ---------- */
function confetti(n=44){
  const box=document.getElementById('confetti');
  const em=['🎉','⭐','🌟','🎊','✨','🥳','🏆','💫','🧱','🎈'];
  for(let i=0;i<n;i++){
    const s=document.createElement('div');
    s.className='confetti-piece';s.textContent=pick(em);
    s.style.left=Math.random()*100+'vw';
    s.style.animationDuration=(1.6+Math.random()*1.9)+'s';
    s.style.fontSize=(18+Math.random()*24)+'px';
    box.appendChild(s);setTimeout(()=>s.remove(),3700);
  }
}

/* ---------- étoiles ---------- */
function addStar(n=1){
  state.stars+=n;state.streak++;
  const el=document.getElementById('stars-badge');
  if(el) el.textContent='⭐ '+state.stars;
}
function resetStreak(){state.streak=0;}

/* ---------- barre du haut ---------- */
function bar(title){
  return `<header class="bar">
    <button class="home-btn" onclick="showMenu()">🏠</button>
    <span class="pill">${title}</span>
    <span class="spacer"></span>
    <span class="pill avatar" onclick="pickAvatar()" title="Changer d'avatar">${state.avatar||'🙂'}</span>
    <span class="pill" onclick="pickAge()" title="Changer d'âge">${state.age} ans</span>
    <span class="pill stars" id="stars-badge">⭐ ${state.stars}</span>
  </header>`;
}

/* =====================================================================
   ACCUEIL
   ===================================================================== */
function welcome(){
  state.game=null;
  app.innerHTML=`<div class="screen hero">
    <span class="mascot">${state.avatar||'🧱'}</span>
    <h1 class="logo">Bric-à-Blocs</h1>
    <p class="subtitle">Construis, observe, calcule &amp; apprends en t'amusant&nbsp;!</p>
    <button class="cta" onclick="beginFlow()">🚀 Jouer</button>
    ${state.stars>0?`<p class="subtitle" style="margin-top:10px">Déjà <b>${state.stars} ⭐</b> gagnées — bravo&nbsp;!</p>`:''}
  </div>`;
}
function beginFlow(){ sndClick(); state.avatar?(state.age?showMenu():pickAge()):pickAvatar(); }

/* ---------- choix de l'avatar ---------- */
const AVATARS={
  '🐾 Animaux':['🦊','🐼','🐸','🦁','🐵','🐧','🦉','🐯','🐨','🐷','🐰','🐬'],
  '🤖 Robots & espace':['🤖','👾','🚀','🛸','⚡','👽'],
  '✨ Fantastique':['🦄','🐉','🧚','🦖','🧙','🦸'],
};
function pickAvatar(){
  let html='';
  for(const [grp,list] of Object.entries(AVATARS)){
    html+=`<p class="eyebrow" style="text-align:left;margin:14px 0 8px">${grp}</p>
      <div class="pickgrid">${list.map(a=>`
        <div class="pick ${state.avatar===a?'sel':''}" onclick="chooseAvatar('${a}')">${a}</div>`).join('')}</div>`;
  }
  app.innerHTML=`<div class="screen">
    <h1 class="logo" style="font-size:clamp(24px,7vw,40px)">Choisis ton héros&nbsp;!</h1>
    <p class="subtitle">Il t'accompagnera dans tous les jeux 🎮</p>
    <div class="card">${html}</div>
  </div>`;
}
function chooseAvatar(a){ sndGood(); state.avatar=a; setTimeout(()=> state.age?showMenu():pickAge(), 250); }

/* ---------- choix de l'âge ---------- */
function pickAge(){
  let ages='';
  for(let a=3;a<=12;a++) ages+=`<button class="age-btn" onclick="chooseAge(${a})">${a}</button>`;
  app.innerHTML=`<div class="screen">
    <div class="row" style="justify-content:flex-start;margin-bottom:8px">
      <span class="mascot" style="font-size:56px;animation:none">${state.avatar||'🙂'}</span>
    </div>
    <h1 class="logo" style="font-size:clamp(24px,7vw,40px)">Quel âge as-tu&nbsp;?</h1>
    <p class="subtitle">Les jeux s'adaptent à toi 👇</p>
    <div class="card"><div class="grid age-grid">${ages}</div></div>
  </div>`;
}
function chooseAge(a){ sndClick(); state.age=a; showMenu(); }

/* =====================================================================
   MENU
   ===================================================================== */
const GAMES=[
  {id:'construire',emoji:'🧱',nom:'Construction',desc:'Blocs : maison, camion…',min:3,color:'var(--r)'},
  {id:'chasse',    emoji:'🔍',nom:'Chasse aux Objets',desc:'À trouver autour de toi',min:3,color:'var(--g)'},
  {id:'calcul',    emoji:'🔢',nom:'Calcul Malin',desc:'Nombres & maths',min:3,color:'var(--b)'},
  {id:'mots',      emoji:'🔤',nom:'Les Mots',desc:'Lettres & lecture',min:3,color:'var(--pink)'},
  {id:'memory',    emoji:'🧠',nom:'Memory',desc:'Trouve les paires',min:3,color:'var(--o)'},
  {id:'formes',    emoji:'🎨',nom:'Couleurs & Formes',desc:'Observe bien',min:3,max:8,color:'var(--p)'},
  {id:'intrus',    emoji:'🕵️',nom:"Trouve l'Intrus",desc:'Logique & réflexion',min:5,color:'#E8556B'},
  {id:'quiz',      emoji:'🌍',nom:'Quiz Découverte',desc:'Animaux, nature, monde',min:6,color:'#3AA0FF'},
  {id:'cahier',    emoji:'📒',nom:'Cahier de Vacances',desc:'Défis mélangés',min:5,color:'#00B894'},
];
function showMenu(){
  state.game=null;
  const list=GAMES.filter(g=>state.age>=g.min && state.age<=(g.max||99));
  const btns=list.map(g=>`
    <button class="game-btn" style="background:${g.color}" onclick="startGame('${g.id}')">
      <span class="emoji">${g.emoji}</span><span>${g.nom}</span><small>${g.desc}</small>
    </button>`).join('');
  app.innerHTML=`<div class="screen">
    ${bar('Menu')}
    <h2 class="q">Choisis ton jeu, ${state.avatar} !</h2>
    <div class="grid cols-2">${btns}</div>
  </div>`;
}
function startGame(id){
  sndClick();resetStreak();
  ({construire:gameConstruire,chasse:gameChasse,calcul:gameCalcul,mots:gameMots,
    memory:gameMemory,formes:gameFormes,intrus:gameIntrus,quiz:gameQuiz,cahier:gameCahier})[id]();
}

/* =====================================================================
   MOTEUR QCM  (une manche = 5 questions ; +1 ⭐ par bonne réponse)
   ===================================================================== */
function quizRound(cfg){
  let idx=0,correct=0;const total=cfg.total||5;
  function render(){
    if(idx>=total) return endRound(cfg.title,correct,total);
    const Q=cfg.makeQuestion();
    const opts=shuffle(Q.options);
    app.innerHTML=`<div class="screen">
      ${bar(cfg.title)}
      <div class="progress"><span style="width:${(idx/total)*100}%"></span></div>
      <h2 class="q">${Q.instruction||''}</h2>
      ${Q.promptHTML||''}
      <div class="options"></div>
      <div class="feedback" id="fb"></div>
    </div>`;
    const box=app.querySelector('.options');
    box.style.gridTemplateColumns=Q.cols==='cols-1'?'1fr':Q.cols==='cols-4'?'repeat(4,1fr)':Q.cols==='cols-3'?'repeat(3,1fr)':'repeat(2,1fr)';
    box.innerHTML=opts.map((o,i)=>`<button class="opt ${Q.small?'small':''}" data-i="${i}">${o.label}</button>`).join('');
    box.querySelectorAll('.opt').forEach(btn=>{
      btn.onclick=()=>{
        const chosen=opts[+btn.dataset.i];
        box.querySelectorAll('.opt').forEach(b=>b.disabled=true);
        const fb=document.getElementById('fb');
        if(chosen.ok){
          btn.classList.add('good');sndGood();correct++;addStar();
          fb.textContent=pick(['Bravo ! 🎉','Super ! ⭐','Génial ! 👏','Exact ! 🌟','Bien joué ! 💪']);
        }else{
          btn.classList.add('bad');sndBad();resetStreak();
          box.querySelectorAll('.opt').forEach((b,i)=>{if(opts[i].ok)b.classList.add('good');});
          fb.textContent=Q.wrongMsg||'Presque ! 😊';
        }
        setTimeout(()=>{idx++;render();},chosen.ok?750:1300);
      };
    });
  }
  render();
}
function endRound(title,correct,total){
  const perfect=correct===total;
  if(correct>=Math.ceil(total*0.6))confetti(perfect?64:32);
  if(perfect)sndWin();
  const stars=correct>=total?'⭐⭐⭐':correct>=total*0.6?'⭐⭐':correct>0?'⭐':'💪';
  const msg=perfect?'PARFAIT ! Champion 🏆':correct>=total*0.6?'Très bien joué ! 🎉':correct>0?'Continue, tu progresses ! 😊':'On réessaie ensemble ? 💪';
  app.innerHTML=`<div class="screen">
    ${bar(title)}
    <div class="card center">
      <div class="big-emoji">${perfect?'🏆':correct>0?'🎉':'🌱'}</div>
      <h2 style="font-size:26px">${msg}</h2>

function gameConstruire(){ state.game='construire'; buildSetup('maison'); }
function buildSetup(modelKey){
  const libre = modelKey==='libre';
  const model = libre?{nom:'Libre',emoji:'🎨',w:10,rows:Array(10).fill('.'.repeat(10))}:BUILDS[modelKey];
  const w=model.w, h=model.rows.length;
  const target=model.rows.join('').split('');
  const grid=Array(w*h).fill('.');
  // couleurs proposées
  let colors = libre ? ['R','O','Y','G','B','P','M','N','W','K']
    : [...new Set(target.filter(c=>c!=='.'))];
  let sel = colors[0];
  let eraser=false;

  const miniStyle=`grid-template-columns:repeat(${w},1fr)`;
  const mini=`<div class="mini" style="${miniStyle}">${target.map(c=>
    `<i style="background:${c==='.'?'transparent':BLOCK[c]}"></i>`).join('')}</div>`;

  function paletteHTML(){
    return `<div class="palette">
      ${colors.map(c=>`<div class="swatch ${!eraser&&sel===c?'sel':''}" style="background:${BLOCK[c]}"
          title="${BLOCKNAME[c]}" onclick="__bpick('${c}')"></div>`).join('')}
      <div class="swatch tool ${eraser?'sel':''}" title="Gomme" onclick="__berase()">🧽</div>
    </div>`;
  }
  function stats(){
    let ok=0,tot=0,extra=0;
    for(let i=0;i<target.length;i++){
      if(target[i]!=='.'){tot++; if(grid[i]===target[i])ok++;}
      else if(grid[i]!=='.')extra++;
    }
    return {ok,tot,extra,win:ok===tot && extra===0 && !libre};
  }
  function render(){
    const s=stats();
    app.innerHTML=`<div class="screen">
      ${bar('🧱 Construction')}
      <div class="row" style="margin-bottom:10px">
        ${Object.entries(BUILDS).map(([k,v])=>`<button class="chip ${k===modelKey?'active':''}" onclick="buildSetup('${k}')">${v.emoji} ${v.nom}</button>`).join('')}
        <button class="chip ${libre?'active':''}" onclick="buildSetup('libre')">🎨 Libre</button>
      </div>
      <div class="build-wrap">
        <div class="row" style="justify-content:space-between;align-items:center;gap:14px">
          <div style="display:flex;align-items:center;gap:12px">
            ${libre?`<span style="font-size:40px">🎨</span><b>Construis ce que tu veux&nbsp;!</b>`
              :`${mini}<div><b style="font-size:18px">Reproduis le ${model.nom.toLowerCase()} ${model.emoji}</b><br>
                 <span style="color:var(--ink-soft);font-weight:800">${s.ok} / ${s.tot} blocs bien placés</span></div>`}
          </div>
        </div>
        <div class="build-grid" style="--ar:${w}/${h};grid-template-columns:repeat(${w},1fr)">
          ${grid.map((c,i)=>{
            let cls='bcell',bg='';
            if(c!=='.'){cls+=' block';bg=BLOCK[c];}
            else if(!libre&&target[i]!=='.'){cls+=' ghost';bg=BLOCK[target[i]];}
            return `<div class="${cls}" data-i="${i}" style="background:${bg||'rgba(255,255,255,.06)'}"></div>`;
          }).join('')}
        </div>
        ${paletteHTML()}
        <button class="btn-primary btn-ghost" onclick="buildSetup('${modelKey}')">🗑️ Tout effacer</button>
        <div class="feedback" id="bfb">${s.win?'🏆 Bravo, modèle terminé&nbsp;!':''}</div>
      </div>
    </div>`;
    app.querySelectorAll('.bcell').forEach(el=>{
      el.onclick=()=>{
        const i=+el.dataset.i;
        if(eraser){ grid[i]='.'; }
        else { grid[i]= grid[i]===sel ? '.' : sel; }
        sndPlace();
        const s2=stats();
        if(s2.win){ addStar(3); sndWin(); confetti(64); }
        render();
      };
    });
  }
  // handlers globaux (fermeture)
  window.__bpick=(c)=>{ sel=c; eraser=false; render(); };
  window.__berase=()=>{ eraser=!eraser; render(); };
  render();
}

/* =====================================================================
   🧠 MEMORY (retournement fiable, sans 3D)
   ===================================================================== */
const MEM_EMO=['🐶','🐱','🐰','🦊','🐼','🐸','🦁','🐷','🐵','🐧','🐢','🦋','🐝','🐳','🦉','🦄','🐙','🦖'];
function gameMemory(){
  state.game='memory';
  const pairs=state.age<=5?4:state.age<=8?6:8;
  const chosen=sample(MEM_EMO,pairs);
  const deck=shuffle([...chosen,...chosen].map((e,i)=>({e,id:i,up:false,matched:false})));
  let open=[],lock=false,matched=0,moves=0;
  const cols=4;
  function render(){
    app.innerHTML=`<div class="screen">
      ${bar('🧠 Memory')}
      <h2 class="q">Retrouve les paires 🃏</h2>
      <p class="subtitle" style="margin-bottom:12px">Coups : ${moves}</p>
      <div class="mem-grid" style="grid-template-columns:repeat(${cols},1fr)">
        ${deck.map((c,i)=>`<div class="mem-card ${c.up||c.matched?'up':''} ${c.matched?'matched':''}" data-i="${i}">${(c.up||c.matched)?c.e:'❓'}</div>`).join('')}
      </div>
      <div class="feedback" id="fb"></div>
    </div>`;
    app.querySelectorAll('.mem-card').forEach(el=>{
      el.onclick=()=>{
        if(lock)return;
        const c=deck[+el.dataset.i];
        if(c.up||c.matched)return;
        c.up=true;sndClick();open.push(c);render();
        if(open.length===2){
          lock=true;moves++;
          if(open[0].e===open[1].e){
            setTimeout(()=>{open.forEach(o=>o.matched=true);matched++;open=[];lock=false;
              sndGood();addStar();if(matched===pairs){confetti(64);sndWin();}render();},480);
          }else{
            sndBad();
            setTimeout(()=>{open.forEach(o=>o.up=false);open=[];lock=false;render();},850);
          }
        }
      };
    });
    if(matched===pairs){
      document.getElementById('fb').innerHTML=`🏆 Gagné en ${moves} coups&nbsp;!
        <button class="btn-primary btn-green" onclick="gameMemory()">🔄 Rejouer</button>`;
    }
  }
  render();
}

function calculQuestion(t,age){
  age=age||state.age;
  if(t==='petit'){
    const emo=pick(['🍎','🐶','⭐','🎈','🚗','🌸']);const n=randInt(1,age<=4?5:10);
    let o=new Set([n]);while(o.size<3)o.add(randInt(1,10));
    return {instruction:'Compte les objets 🔢',
      promptHTML:`<div class="prompt-box"><div style="font-size:36px;line-height:1.3">${emo.repeat(n)}</div></div>`,
      cols:'cols-3',options:[...o].map(v=>({label:v,ok:v===n}))};
  }
  if(t==='moyen'){
    const add=Math.random()<0.6;let a,b,good,sym;
    if(add){a=randInt(1,age<=6?10:20);b=randInt(1,age<=6?10:20);good=a+b;sym='+';}
    else{a=randInt(2,20);b=randInt(1,a);good=a-b;sym='−';}
    let o=new Set([good]);while(o.size<4)o.add(Math.max(0,good+randInt(-4,4)));
    return {instruction:'Combien font…',
      promptHTML:`<div class="prompt-box"><span class="txt">${a} ${sym} ${b} = ?</span></div>`,
      options:[...o].map(v=>({label:v,ok:v===good}))};
  }
  const type=pick(['x','x','÷','pb']);
  if(type==='x'){const a=randInt(2,10),b=randInt(2,10),good=a*b;
    let o=new Set([good]);while(o.size<4)o.add(good+randInt(-9,9));
    return {instruction:'Multiplication ✖️',
      promptHTML:`<div class="prompt-box"><span class="txt">${a} × ${b} = ?</span></div>`,
      options:[...o].filter(v=>v>0).slice(0,4).map(v=>({label:v,ok:v===good}))};}
  if(type==='÷'){const b=randInt(2,9),good=randInt(2,10),a=b*good;
    let o=new Set([good]);while(o.size<4)o.add(Math.max(1,good+randInt(-3,3)));
    return {instruction:'Division ➗',
      promptHTML:`<div class="prompt-box"><span class="txt">${a} ÷ ${b} = ?</span></div>`,
      options:[...o].map(v=>({label:v,ok:v===good}))};}
  const prix=randInt(2,9),qte=randInt(2,6),good=prix*qte;
  let o=new Set([good]);while(o.size<4)o.add(good+randInt(-8,8));
  return {instruction:'Petit problème 🧩',
    promptHTML:`<div class="prompt-box" style="font-size:19px;font-weight:800;padding:20px">Un jouet coûte ${prix} €.<br>Combien coûtent ${qte} jouets ?</div>`,
    options:[...o].filter(v=>v>0).slice(0,4).map(v=>({label:v+' €',ok:v===good}))};
}
function motQuestion(t){
  if(t==='petit'){
    const w=pick(MOTS),good=w.mot[0];let L=new Set([good]);const al='ABCDEFGHIJKLMNOPRSTU';
    while(L.size<3)L.add(al[rand(al.length)]);
    return {instruction:'Par quelle lettre commence ce mot ?',
      promptHTML:`<div class="prompt-box"><div class="big-emoji" style="margin:0">${w.emo}</div><div style="font-weight:900;font-size:20px">${w.mot.toLowerCase()}</div></div>`,
      cols:'cols-3',options:[...L].map(l=>({label:l,ok:l===good}))};
  }
  if(t==='moyen'){
    const w=pick(MOTS),i=randInt(1,w.mot.length-1),good=w.mot[i];
    const shown=w.mot.split('').map((c,k)=>k===i?'_':c).join('');
    let L=new Set([good]);const al='ABCDEFGHILMNOPRSTUV';while(L.size<4)L.add(al[rand(al.length)]);
    return {instruction:'Quelle lettre manque ?',
      promptHTML:`<div class="prompt-box"><div style="font-size:40px;margin-bottom:6px">${w.emo}</div><span class="txt">${shown}</span></div>`,
      cols:'cols-4',options:[...L].map(l=>({label:l,ok:l===good}))};
  }
  const ortho=pick(ORTHO);
  return {instruction:'Quel mot est bien orthographié ?',cols:'cols-1',small:true,
    options:[{label:ortho.bon,ok:true},...ortho.faux.map(f=>({label:f,ok:false}))].slice(0,3),
    wrongMsg:"La bonne orthographe est en vert 👀"};
}
function formeQuestion(){
  if(Math.random()<0.5){
    const c=pick(COULEURS);let o=new Set([c[0]]);while(o.size<3)o.add(pick(COULEURS)[0]);
    return {instruction:'Quelle est cette couleur ?',
      promptHTML:`<div class="prompt-box"><div style="width:120px;height:120px;border-radius:22px;margin:4px auto;background:${c[1]};border:var(--border)"></div></div>`,
      cols:'cols-3',options:shuffle([...o]).map(v=>({label:v,ok:v===c[0]}))};
  }
  const f=pick(FORMES);let o=new Set([f[0]]);while(o.size<3)o.add(pick(FORMES)[0]);
  return {instruction:'Quelle est cette forme ?',
    promptHTML:`<div class="prompt-box"><div style="font-size:110px;line-height:1;color:var(--p)">${f[1]}</div></div>`,
    cols:'cols-3',options:shuffle([...o]).map(v=>({label:v,ok:v===f[0]}))};
}
function intrusQuestion(age){
  const count=age<=6?4:6;const s=pick(INTRUS_SETS);
  const goods=sample(s.good,count-1),bad=pick(s.bad);
  const all=shuffle([...goods.map(e=>({label:e,ok:false})),{label:bad,ok:true}]);
  return {instruction:"Clique sur l'intrus 👀",
    promptHTML:`<p class="subtitle">Un élément n'est pas comme les autres…</p>`,
    cols:count===4?'cols-2':'cols-3',options:all,wrongMsg:"L'intrus était en vert 😉"};
}
function quizQuestion(age){
  const bank=QUIZ.filter(x=>x.min<=age),x=pick(bank);
  return {instruction:x.q,small:true,
    cols:(x.a.length>10||x.b.some(v=>v.length>10))?'cols-1':'cols-2',
    options:[{label:x.a,ok:true},...x.b.map(v=>({label:v,ok:false}))],
    wrongMsg:'La bonne réponse est en vert 💡'};
}

/* ---- Jeux basés sur le moteur QCM ---- */
function gameCalcul(){state.game='calcul';const t=tier(state.age);quizRound({title:'🔢 Calcul',makeQuestion:()=>calculQuestion(t)});}
function gameMots(){state.game='mots';const t=tier(state.age);quizRound({title:'🔤 Les Mots',makeQuestion:()=>motQuestion(t)});}
function gameFormes(){state.game='formes';quizRound({title:'🎨 Couleurs & Formes',makeQuestion:()=>formeQuestion()});}
function gameIntrus(){state.game='intrus';quizRound({title:"🕵️ Trouve l'Intrus",makeQuestion:()=>intrusQuestion(state.age)});}
function gameQuiz(){state.game='quiz';quizRound({title:'🌍 Quiz',makeQuestion:()=>quizQuestion(state.age)});}
function gameCahier(){
  state.game='cahier';const t=tier(state.age);
  quizRound({title:'📒 Cahier de Vacances',total:8,makeQuestion(){
    const kinds=t==='petit'?['calc','mot','forme','intrus']:['calc','mot','intrus','quiz'];
    const k=pick(kinds);
    if(k==='calc')return calculQuestion(t);
    if(k==='mot')return motQuestion(t);
    if(k==='forme')return formeQuestion();
    if(k==='intrus')return intrusQuestion(state.age);
    return quizQuestion(state.age);
  }});
}

welcome();
