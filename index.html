<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#6C5CE7">
<meta name="description" content="Jouons & Apprenons — jeux éducatifs interactifs pour enfants de 3 à 12 ans.">
<title>🎈 Jouons & Apprenons — Jeux éducatifs 3-12 ans</title>
<style>
  :root{
    --violet:#6C5CE7; --rose:#FF6B9D; --jaune:#FFD32A; --vert:#20BF6B;
    --bleu:#45AAF2; --orange:#FF9F43; --rouge:#EE5253; --turquoise:#0FB9B1;
    --sombre:#2D3436; --clair:#FFFFFF;
    --ombre:0 10px 30px rgba(0,0,0,.15);
    --ombre-btn:0 6px 0 rgba(0,0,0,.15);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"Nunito","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
    background:linear-gradient(135deg,#6C5CE7 0%,#a55eea 50%,#FF6B9D 100%);
    color:var(--sombre);
    min-height:100vh;overflow-x:hidden;
    display:flex;flex-direction:column;
    user-select:none;-webkit-user-select:none;
  }
  #app{flex:1;display:flex;flex-direction:column;max-width:900px;margin:0 auto;width:100%;padding:16px}
  .screen{animation:pop .4s ease}
  @keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:scale(1)}}

  /* Barre du haut */
  header.bar{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:rgba(255,255,255,.16);backdrop-filter:blur(6px);
    border-radius:22px;padding:10px 14px;margin-bottom:14px;color:#fff;
  }
  .bar .home-btn{
    background:#fff;color:var(--violet);border:none;border-radius:16px;
    font-size:20px;font-weight:900;padding:8px 14px;cursor:pointer;box-shadow:var(--ombre-btn);
  }
  .bar .home-btn:active{transform:translateY(3px);box-shadow:none}
  .bar .infos{display:flex;gap:10px;align-items:center;font-weight:900}
  .badge{background:#fff;color:var(--sombre);border-radius:14px;padding:6px 12px;font-size:16px;white-space:nowrap}
  .badge.stars{color:#e0a800}

  /* Titres */
  h1.logo{color:#fff;text-align:center;font-size:clamp(28px,7vw,46px);font-weight:900;
    text-shadow:0 4px 0 rgba(0,0,0,.18);margin:8px 0 4px;line-height:1.1}
  .subtitle{color:#fff;text-align:center;font-weight:700;opacity:.95;margin-bottom:18px;font-size:clamp(14px,3.5vw,18px)}
  h2.q{text-align:center;color:#fff;font-size:clamp(20px,5vw,30px);font-weight:900;margin:6px 0 18px;text-shadow:0 3px 0 rgba(0,0,0,.15)}

  /* Cartes / grilles */
  .card{background:#fff;border-radius:26px;box-shadow:var(--ombre);padding:20px}
  .grid{display:grid;gap:14px}
  .cols-2{grid-template-columns:repeat(2,1fr)}
  .cols-3{grid-template-columns:repeat(3,1fr)}
  .cols-4{grid-template-columns:repeat(4,1fr)}
  .cols-auto{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}

  /* Sélecteur d'âge */
  .age-grid{grid-template-columns:repeat(5,1fr)}
  .age-btn{
    aspect-ratio:1;border:none;border-radius:22px;cursor:pointer;
    font-size:clamp(22px,6vw,34px);font-weight:900;color:#fff;
    display:flex;align-items:center;justify-content:center;box-shadow:var(--ombre-btn);
    transition:transform .1s;
  }
  .age-btn:active{transform:translateY(4px);box-shadow:none}
  .age-btn:nth-child(10n+1){background:var(--rose)}
  .age-btn:nth-child(10n+2){background:var(--bleu)}
  .age-btn:nth-child(10n+3){background:var(--vert)}
  .age-btn:nth-child(10n+4){background:var(--orange)}
  .age-btn:nth-child(10n+5){background:var(--turquoise)}
  .age-btn:nth-child(10n+6){background:var(--violet)}
  .age-btn:nth-child(10n+7){background:var(--rouge)}
  .age-btn:nth-child(10n+8){background:var(--jaune);color:var(--sombre);text-shadow:none}
  .age-btn:nth-child(10n+9){background:#8854d0}
  .age-btn:nth-child(10n){background:#e84393}

  /* Boutons de jeu (menu) */
  .game-btn{
    border:none;border-radius:24px;cursor:pointer;padding:18px 12px;color:#fff;
    display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;
    font-weight:900;font-size:clamp(14px,3.4vw,18px);box-shadow:var(--ombre-btn);
    transition:transform .1s;min-height:130px;justify-content:center;
  }
  .game-btn .emoji{font-size:clamp(38px,10vw,52px);line-height:1}
  .game-btn small{font-weight:700;opacity:.9;font-size:12px}
  .game-btn:active{transform:translateY(4px);box-shadow:none}

  /* Options de réponse */
  .options{display:grid;gap:14px;margin-top:6px}
  .opt{
    border:none;border-radius:22px;cursor:pointer;background:#fff;color:var(--sombre);
    font-size:clamp(22px,6vw,34px);font-weight:900;padding:22px 10px;box-shadow:var(--ombre-btn);
    transition:transform .1s;min-height:78px;
  }
  .opt.small{font-size:clamp(18px,4.5vw,24px)}
  .opt:active{transform:translateY(4px);box-shadow:none}
  .opt.good{background:var(--vert)!important;color:#fff;animation:goodPulse .5s}
  .opt.bad{background:var(--rouge)!important;color:#fff;animation:shake .4s}
  @keyframes goodPulse{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

  .big-emoji{font-size:clamp(70px,22vw,120px);text-align:center;line-height:1;margin:6px 0 14px}
  .prompt-box{background:#fff;border-radius:24px;padding:18px;text-align:center;box-shadow:var(--ombre);margin-bottom:16px}
  .prompt-box .txt{font-size:clamp(26px,7vw,42px);font-weight:900;letter-spacing:2px}

  /* Barre de progression */
  .progress{height:16px;background:rgba(255,255,255,.3);border-radius:10px;overflow:hidden;margin:4px 0 16px}
  .progress > span{display:block;height:100%;background:linear-gradient(90deg,var(--jaune),var(--vert));width:0;transition:width .4s;border-radius:10px}

  /* Chasse aux objets */
  .hunt-item{
    display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:12px 14px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);cursor:pointer;transition:.15s;border:3px solid transparent;
  }
  .hunt-item .he{font-size:34px}
  .hunt-item .hn{font-weight:800;font-size:clamp(15px,4vw,19px);flex:1}
  .hunt-item .check{width:34px;height:34px;border-radius:50%;border:3px solid #ddd;display:flex;align-items:center;justify-content:center;font-size:20px;color:transparent}
  .hunt-item.found{background:#eafaf0;border-color:var(--vert)}
  .hunt-item.found .check{background:var(--vert);border-color:var(--vert);color:#fff}
  .hunt-item.found .hn{text-decoration:line-through;opacity:.6}

  /* Memory */
  .mem-grid{display:grid;gap:10px}
  .mem-card{
    aspect-ratio:1;border-radius:18px;cursor:pointer;position:relative;
    font-size:clamp(28px,9vw,46px);display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--violet),var(--rose));box-shadow:var(--ombre-btn);
    transition:transform .2s;
  }
  .mem-card .face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    backface-visibility:hidden;border-radius:18px}
  .mem-card .back{background:linear-gradient(135deg,var(--violet),var(--bleu));color:#fff;font-size:30px}
  .mem-card .front{background:#fff;transform:rotateY(180deg)}
  .mem-card.flip{transform:rotateY(180deg)}
  .mem-card.flip .back{opacity:0}
  .mem-card.matched{opacity:.55}

  /* Feedback / célébration */
  .feedback{text-align:center;color:#fff;font-size:clamp(22px,6vw,34px);font-weight:900;min-height:44px;margin-top:14px;text-shadow:0 3px 0 rgba(0,0,0,.15)}
  .btn-primary{
    display:block;width:100%;border:none;border-radius:22px;background:var(--jaune);color:var(--sombre);
    font-size:clamp(18px,5vw,24px);font-weight:900;padding:18px;cursor:pointer;box-shadow:var(--ombre-btn);margin-top:14px;
  }
  .btn-primary:active{transform:translateY(4px);box-shadow:none}
  .btn-ghost{background:rgba(255,255,255,.9);color:var(--violet)}

  .center{text-align:center}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .chip{background:rgba(255,255,255,.9);border:none;border-radius:16px;padding:12px 18px;font-weight:900;cursor:pointer;box-shadow:var(--ombre-btn);color:var(--violet);font-size:16px}
  .chip.active{background:var(--jaune);color:var(--sombre)}
  .chip:active{transform:translateY(3px);box-shadow:none}

  /* Confetti */
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
  .confetti-piece{position:absolute;top:-30px;font-size:26px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:1}}

  footer{color:#fff;text-align:center;opacity:.85;font-weight:700;font-size:12px;padding:14px}

  @media(max-width:420px){
    .age-grid{grid-template-columns:repeat(4,1fr)}
    #app{padding:12px}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="confetti"></div>
<footer>🎈 Jouons &amp; Apprenons · Fait avec ❤️ pour les enfants curieux</footer>

<script>
/* ============================================================
   JOUONS & APPRENONS — jeu éducatif 3-12 ans
   Un seul fichier, aucune dépendance, fonctionne hors-ligne.
   ============================================================ */

const app = document.getElementById('app');

const state = {
  age: null,
  stars: 0,          // étoiles gagnées (session)
  streak: 0,
  game: null,
};

/* ---------- utilitaires ---------- */
const rand = (n)=>Math.floor(Math.random()*n);
const randInt = (a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick = (arr)=>arr[rand(arr.length)];
const shuffle = (arr)=>{const a=[...arr];for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const sample = (arr,n)=>shuffle(arr).slice(0,n);

// tranche d'âge : 'petit' (3-5), 'moyen' (6-8), 'grand' (9-12)
function tier(age){ return age<=5?'petit':age<=8?'moyen':'grand'; }

/* ---------- sons (Web Audio, sans fichier) ---------- */
let actx;
function beep(freqs, dur=0.12, type='sine'){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    freqs.forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type=type; o.frequency.value=f;
      o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.25,t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.start(t); o.stop(t+dur); t+=dur*0.9;
    });
  }catch(e){}
}
const sndGood = ()=>beep([523,659,784],0.13,'triangle');
const sndWin  = ()=>beep([523,659,784,1046],0.16,'triangle');
const sndBad  = ()=>beep([200,150],0.18,'sawtooth');
const sndClick= ()=>beep([440],0.05,'square');

/* ---------- confetti ---------- */
function confetti(n=40){
  const box=document.getElementById('confetti');
  const emojis=['🎉','⭐','🌟','🎊','✨','🥳','🏆','💫','🎈'];
  for(let i=0;i<n;i++){
    const s=document.createElement('div');
    s.className='confetti-piece';
    s.textContent=pick(emojis);
    s.style.left=Math.random()*100+'vw';
    s.style.animationDuration=(1.6+Math.random()*1.8)+'s';
    s.style.fontSize=(18+Math.random()*22)+'px';
    box.appendChild(s);
    setTimeout(()=>s.remove(),3600);
  }
}

/* ---------- gestion des étoiles ---------- */
function addStar(n=1){
  state.stars+=n; state.streak++;
  const el=document.getElementById('stars-badge');
  if(el) el.textContent='⭐ '+state.stars;
}
function resetStreak(){ state.streak=0; }

/* ---------- barre du haut ---------- */
function bar(title){
  return `<header class="bar">
    <button class="home-btn" onclick="goHome()">🏠</button>
    <div class="infos">
      <span class="badge">${title}</span>
      <span class="badge stars" id="stars-badge">⭐ ${state.stars}</span>
    </div>
  </header>`;
}

/* ============================================================
   ÉCRAN 1 — ACCUEIL / CHOIX DE L'ÂGE
   ============================================================ */
function goHome(){
  state.game=null;
  let ages='';
  for(let a=3;a<=12;a++){
    ages+=`<button class="age-btn" onclick="chooseAge(${a})">${a}</button>`;
  }
  app.innerHTML=`<div class="screen">
    <h1 class="logo">🎈 Jouons &amp; Apprenons</h1>
    <p class="subtitle">Choisis ton âge pour découvrir tes jeux 👇</p>
    <div class="card">
      <div class="grid age-grid">${ages}</div>
    </div>
    ${state.stars>0?`<p class="subtitle" style="margin-top:16px">Tu as déjà gagné <b>${state.stars} ⭐</b> — bravo&nbsp;!</p>`:''}
  </div>`;
}

function chooseAge(a){
  sndClick();
  state.age=a;
  showMenu();
}

/* ============================================================
   ÉCRAN 2 — MENU DES JEUX (adapté à l'âge)
   ============================================================ */
const GAMES = [
  {id:'calcul',  emoji:'🔢', nom:'Calcul Malin',   desc:'Nombres & maths',      min:3, color:'var(--bleu)'},
  {id:'mots',    emoji:'🔤', nom:'Les Mots',        desc:'Lettres & lecture',    min:3, color:'var(--rose)'},
  {id:'chasse',  emoji:'🔍', nom:'Chasse aux Objets',desc:'À trouver autour de toi', min:3, color:'var(--vert)'},
  {id:'memory',  emoji:'🧠', nom:'Memory',          desc:'Trouve les paires',    min:3, color:'var(--orange)'},
  {id:'formes',  emoji:'🎨', nom:'Couleurs & Formes',desc:'Observe bien',        min:3, max:8, color:'var(--turquoise)'},
  {id:'intrus',  emoji:'🕵️', nom:"Trouve l'Intrus", desc:'Logique & réflexion',  min:5, color:'var(--rouge)'},
  {id:'quiz',    emoji:'🌍', nom:'Quiz Découverte',  desc:'Anim., nature, monde', min:6, color:'var(--violet)'},
  {id:'cahier',  emoji:'📒', nom:'Cahier de Vacances',desc:'Défis mélangés',      min:5, color:'#e84393'},
];

function showMenu(){
  const list=GAMES.filter(g=>state.age>=g.min && state.age<=(g.max||99));
  const btns=list.map(g=>`
    <button class="game-btn" style="background:${g.color}" onclick="startGame('${g.id}')">
      <span class="emoji">${g.emoji}</span>
      <span>${g.nom}</span>
      <small>${g.desc}</small>
    </button>`).join('');
  app.innerHTML=`<div class="screen">
    ${bar('J\'ai '+state.age+' ans')}
    <h2 class="q">Quel jeu veux-tu jouer&nbsp;?</h2>
    <div class="grid cols-2">${btns}</div>
  </div>`;
}

function startGame(id){
  sndClick(); resetStreak();
  ({calcul:gameCalcul, mots:gameMots, chasse:gameChasse, memory:gameMemory,
    formes:gameFormes, intrus:gameIntrus, quiz:gameQuiz, cahier:gameCahier})[id]();
}

/* ============================================================
   MOTEUR GÉNÉRIQUE DE QUESTIONS (QCM)
   Une "manche" = 5 questions. À chaque bonne réponse : +1 ⭐.
   ============================================================ */
function quizRound(cfg){
  // cfg: {title, total, makeQuestion()->{promptHTML, options:[{label,ok}], hint?}}
  let idx=0, correct=0;
  const total=cfg.total||5;

  function render(){
    if(idx>=total){ return endRound(cfg.title, correct, total); }
    const Q=cfg.makeQuestion();
    const opts=shuffle(Q.options);
    app.innerHTML=`<div class="screen">
      ${bar(cfg.title)}
      <div class="progress"><span style="width:${(idx/total)*100}%"></span></div>
      <h2 class="q">${Q.instruction||''}</h2>
      ${Q.promptHTML||''}
      <div class="options ${Q.cols||'cols-2'}">
        ${opts.map((o,i)=>`<button class="opt ${Q.small?'small':''}" data-i="${i}">${o.label}</button>`).join('')}
      </div>
      <div class="feedback" id="fb"></div>
    </div>`;
    // grille
    const box=app.querySelector('.options');
    box.classList.add('grid');
    box.style.gridTemplateColumns = Q.cols==='cols-1'?'1fr':Q.cols==='cols-3'?'repeat(3,1fr)':'repeat(2,1fr)';

    app.querySelectorAll('.opt').forEach(btn=>{
      btn.onclick=()=>{
        const chosen=opts[+btn.dataset.i];
        app.querySelectorAll('.opt').forEach(b=>b.disabled=true);
        const fb=document.getElementById('fb');
        if(chosen.ok){
          btn.classList.add('good'); sndGood(); correct++; addStar();
          fb.textContent=pick(['Bravo ! 🎉','Super ! ⭐','Génial ! 👏','Exact ! 🌟','Bien joué ! 💪']);
        }else{
          btn.classList.add('bad'); sndBad(); resetStreak();
          // montrer la bonne
          app.querySelectorAll('.opt').forEach((b,i)=>{ if(opts[i].ok) b.classList.add('good'); });
          fb.textContent=Q.wrongMsg||'Presque ! 😊';
        }
        setTimeout(()=>{ idx++; render(); }, chosen.ok?750:1300);
      };
    });
  }
  render();
}

function endRound(title, correct, total){
  const perfect=correct===total;
  if(correct>=Math.ceil(total*0.6)) confetti(perfect?60:30);
  if(perfect) sndWin();
  const stars = correct>=total?'⭐⭐⭐' : correct>=total*0.6?'⭐⭐' : correct>0?'⭐':'💪';
  const msg = perfect?'PARFAIT ! Tu es un champion 🏆'
            : correct>=total*0.6?'Très bien joué ! 🎉'
            : correct>0?'Bien essayé, continue ! 😊'
            : 'On réessaie ensemble ? 💪';
  app.innerHTML=`<div class="screen">
    ${bar(title)}
    <div class="card center">
      <div class="big-emoji">${perfect?'🏆':correct>0?'🎉':'🌱'}</div>
      <h2 style="font-size:28px;color:var(--violet)">${msg}</h2>
      <p style="font-size:40px;margin:10px 0">${stars}</p>
      <p style="font-weight:800;font-size:20px">Score : ${correct} / ${total}</p>
      <button class="btn-primary" onclick="startGame('${state.game}')">🔄 Rejouer</button>
      <button class="btn-primary btn-ghost" onclick="showMenu()">📚 Autres jeux</button>
    </div>
  </div>`;
}

/* ============================================================
   JEU 1 — CALCUL MALIN
   ============================================================ */
function gameCalcul(){
  state.game='calcul';
  const t=tier(state.age);
  quizRound({
    title:'🔢 Calcul',
    makeQuestion(){
      if(t==='petit'){
        // compter des objets
        const emo=pick(['🍎','🐶','⭐','🎈','🚗','🌸','🐟','🍓']);
        const n=randInt(1,state.age<=4?5:10);
        const good=n;
        let opts=new Set([good]);
        while(opts.size<3) opts.add(randInt(1,10));
        return {
          instruction:'Compte les objets 🔢',
          promptHTML:`<div class="prompt-box"><div style="font-size:38px;line-height:1.3">${emo.repeat(n)}</div></div>`,
          cols:'cols-3',
          options:[...opts].map(v=>({label:v,ok:v===good})),
        };
      }
      if(t==='moyen'){
        const add=Math.random()<0.6;
        let a,b,good,sym;
        if(add){ a=randInt(1,state.age<=6?10:20); b=randInt(1,state.age<=6?10:20); good=a+b; sym='+'; }
        else{ a=randInt(2,20); b=randInt(1,a); good=a-b; sym='−'; }
        let opts=new Set([good]);
        while(opts.size<4) opts.add(Math.max(0,good+randInt(-4,4)));
        return {
          instruction:'Combien font…',
          promptHTML:`<div class="prompt-box"><span class="txt">${a} ${sym} ${b} = ?</span></div>`,
          options:[...opts].map(v=>({label:v,ok:v===good})),
        };
      }
      // grand : x, ÷, problèmes
      const type=pick(['x','x','÷','pb']);
      if(type==='x'){
        const a=randInt(2,10), b=randInt(2,10), good=a*b;
        let opts=new Set([good]); while(opts.size<4) opts.add(good+randInt(-9,9)*pick([1,1,2]));
        return {instruction:'Multiplication ✖️',
          promptHTML:`<div class="prompt-box"><span class="txt">${a} × ${b} = ?</span></div>`,
          options:[...opts].filter(v=>v>0).slice(0,4).map(v=>({label:v,ok:v===good}))};
      }
      if(type==='÷'){
        const b=randInt(2,9), good=randInt(2,10), a=b*good;
        let opts=new Set([good]); while(opts.size<4) opts.add(Math.max(1,good+randInt(-3,3)));
        return {instruction:'Division ➗',
          promptHTML:`<div class="prompt-box"><span class="txt">${a} ÷ ${b} = ?</span></div>`,
          options:[...opts].map(v=>({label:v,ok:v===good}))};
      }
      // petit problème
      const prix=randInt(2,9), qte=randInt(2,6), good=prix*qte;
      let opts=new Set([good]); while(opts.size<4) opts.add(good+randInt(-8,8));
      return {instruction:'Petit problème 🧩',
        promptHTML:`<div class="prompt-box" style="font-size:20px;font-weight:800;padding:22px">Un jouet coûte ${prix} €.<br>Combien coûtent ${qte} jouets ?</div>`,
        options:[...opts].filter(v=>v>0).slice(0,4).map(v=>({label:v+' €',ok:v===good}))};
    }
  });
}

/* ============================================================

const MOTS = [
  {mot:'CHAT',emo:'🐱'},{mot:'CHIEN',emo:'🐶'},{mot:'SOLEIL',emo:'☀️'},{mot:'LUNE',emo:'🌙'},
  {mot:'FLEUR',emo:'🌸'},{mot:'POMME',emo:'🍎'},{mot:'MAISON',emo:'🏠'},{mot:'VOITURE',emo:'🚗'},

  {mot:'PAPILLON',emo:'🦋'},{mot:'ÉLÉPHANT',emo:'🐘'},{mot:'FRAISE',emo:'🍓'},{mot:'GRENOUILLE',emo:'🐸'},
];
const ORTHO = [
  {bon:'aujourd\'hui',faux:['aujourdhui','ojourdhui']},
  {bon:'beaucoup',faux:['beaucou','baucoup']},
  {bon:'toujours',faux:['toujour','toujourd']},
  {bon:'éléphant',faux:['élépant','élephan']},
  {bon:'anniversaire',faux:['aniversaire','annivairsaire']},

  {bon:'longtemps',faux:['lontemps','longtemp']},
  {bon:'quelquefois',faux:['quelque fois','quelkefois']},
  {bon:'nourriture',faux:['nouriture','nouritture']},
  {bon:'dictionnaire',faux:['dictionaire','dixionnaire']},
];
function gameMots(){
  state.game='mots';
  const t=tier(state.age);
  quizRound({
    title:'🔤 Les Mots',
    makeQuestion(){
      if(t==='petit'){
        // première lettre
        const w=pick(MOTS);
        const good=w.mot[0];
        let letters=new Set([good]);
        const alpha='ABCDEFGHIJKLMNOPRSTU';
        while(letters.size<3) letters.add(alpha[rand(alpha.length)]);
        return {instruction:'Par quelle lettre commence ce mot ?',
          promptHTML:`<div class="prompt-box"><div class="big-emoji" style="margin:0">${w.emo}</div><div style="font-weight:800;font-size:20px">${w.mot.toLowerCase()}</div></div>`,
          cols:'cols-3',

        // lettre manquante
        const w=pick(MOTS);
        const i=randInt(1,w.mot.length-1);
        const good=w.mot[i];
        const shown=w.mot.split('').map((c,k)=>k===i?'_':c).join('');

      return {instruction:'Quel mot est bien orthographié ?',
        cols:'cols-1',

    moyen:[['🚌','un bus'],['🚐','une caravane'],['🐝','un insecte'],['🚦','un feu tricolore'],['🪧','un panneau'],['🐈','un chat'],['🌉','un pont'],['🏪','un magasin'],['🛴','une trottinette'],['🦆','un canard'],['🚧','un chantier'],['⛲','une fontaine']],
    grand:[['🚚','un camion'],['🏛️','un bâtiment ancien'],['🚁','quelque chose qui vole'],['🦅','un oiseau de proie'],['🛑','un panneau STOP'],['🚒','un véhicule de secours'],['🌾','un champ'],['🗿','une statue'],['🧗','un mur d\'escalade'],['🚏','un arrêt de bus'],['🪟','une cheminée'],['🚉','une gare ou une voie']],
  }
};
function gameChasse(){
  state.game='chasse';
  chasseSetup('mixte');
}
function chasseSetup(lieu){
  const t=tier(state.age);
  const build=(z)=>HUNT[z][t];
  let pool;
  if(lieu==='interieur') pool=build('interieur');
  else if(lieu==='exterieur') pool=build('exterieur');
  else pool=[...build('interieur'),...build('exterieur')];
  const n = state.age<=5?5 : state.age<=8?7 : 9;
  const items=sample(pool,Math.min(n,pool.length)).map(([e,label])=>({e,label,found:false}));

  function render(){
    const found=items.filter(i=>i.found).length;
    const done=found===items.length;
    app.innerHTML=`<div class="screen">
      ${bar('🔍 Chasse')}
      <h2 class="q">Trouve-les autour de toi&nbsp;! 👀</h2>
      <div class="row" style="margin-bottom:12px">
        <button class="chip ${lieu==='interieur'?'active':''}" onclick="chasseSetup('interieur')">🏠 Intérieur</button>
        <button class="chip ${lieu==='exterieur'?'active':''}" onclick="chasseSetup('exterieur')">🌳 Extérieur</button>
        <button class="chip ${lieu==='mixte'?'active':''}" onclick="chasseSetup('mixte')">🔀 Mixte</button>
      </div>
      <div class="progress"><span style="width:${(found/items.length)*100}%"></span></div>
      <p class="subtitle" style="margin-bottom:12px">${found} / ${items.length} trouvés</p>
      <div class="grid" style="grid-template-columns:1fr">
        ${items.map((it,i)=>`
          <div class="hunt-item ${it.found?'found':''}" data-i="${i}">
            <span class="he">${it.e}</span>
            <span class="hn">J'ai vu ${it.label} !</span>
            <span class="check">✓</span>
          </div>`).join('')}
      </div>
      ${done?`<div class="feedback">🏆 Bravo, tout trouvé&nbsp;!</div>
        <button class="btn-primary" onclick="chasseSetup('${lieu}')">🔄 Nouvelle chasse</button>`
        :`<button class="btn-primary btn-ghost" onclick="chasseSetup('${lieu}')">🎲 Nouvelle liste</button>`}
    </div>`;

    app.querySelectorAll('.hunt-item').forEach(el=>{
      el.onclick=()=>{
        const it=items[+el.dataset.i];
        if(it.found) return;
        it.found=true; sndGood(); addStar();
        const wasDone=items.filter(i=>i.found).length===items.length;
        if(wasDone){ confetti(60); sndWin(); }
        render();
      };
    });
  }
  render();
}

/* ============================================================
   JEU 4 — MEMORY (paires)
   ============================================================ */
const MEM_EMO=['🐶','🐱','🐰','🦊','🐼','🐸','🦁','🐷','🐵','🐧','🐢','🦋','🐝','🐳','🦉','🦄','🐙','🦕'];
function gameMemory(){
  state.game='memory';
  const pairs = state.age<=5?4 : state.age<=8?6 : 8;
  const chosen=sample(MEM_EMO,pairs);
  const deck=shuffle([...chosen,...chosen].map((e,i)=>({e,id:i,flip:false,matched:false})));
  let open=[], lock=false, matched=0, moves=0;

  const cols = pairs<=4?4 : pairs<=6?4 : 4;

  function render(){
    app.innerHTML=`<div class="screen">
      ${bar('🧠 Memory')}
      <h2 class="q">Retrouve les paires 🃏</h2>
      <p class="subtitle" style="margin-bottom:12px">Coups : ${moves}</p>
      <div class="mem-grid" style="grid-template-columns:repeat(${cols},1fr)">
        ${deck.map((c,i)=>`
          <div class="mem-card ${c.flip||c.matched?'flip':''} ${c.matched?'matched':''}" data-i="${i}">
            <div class="face back">❓</div>
            <div class="face front">${c.e}</div>
          </div>`).join('')}
      </div>
      <div class="feedback" id="fb"></div>
    </div>`;

    app.querySelectorAll('.mem-card').forEach(el=>{
      el.onclick=()=>{
        if(lock) return;
        const c=deck[+el.dataset.i];
        if(c.flip||c.matched) return;
        c.flip=true; sndClick(); open.push(c);
        el.classList.add('flip');
        if(open.length===2){
          lock=true; moves++;
          if(open[0].e===open[1].e){
            setTimeout(()=>{
              open.forEach(o=>o.matched=true); matched++;
              open=[]; lock=false; sndGood(); addStar();
              if(matched===pairs){ confetti(60); sndWin(); }
              render();
            },500);
          }else{
            sndBad();
            setTimeout(()=>{ open.forEach(o=>o.flip=false); open=[]; lock=false; render(); },900);
          }
        }
      };
    });
    if(matched===pairs){
      document.getElementById('fb').innerHTML=`🏆 Gagné en ${moves} coups&nbsp;!
        <div><button class="btn-primary" onclick="gameMemory()">🔄 Rejouer</button></div>`;
    }
  }
  render();
}

/* ============================================================
   JEU 8 — CAHIER DE VACANCES (mélange de tous les défis)
   Reprend l'esprit des cahiers d'activités : une page = plusieurs
   types d'exercices qui s'enchaînent.
   ============================================================ */
function gameCahier(){
  state.game='cahier';
  const t=tier(state.age);
  // On réutilise les générateurs des autres jeux (calcul, mots, formes, intrus, quiz)
  quizRound({
    title:'📒 Cahier de Vacances',
    total:8,
    makeQuestion(){
      const kinds = t==='petit'
        ? ['calc','mot','forme','intrus']
        : t==='moyen'
        ? ['calc','mot','intrus','quiz']
        : ['calc','mot','intrus','quiz'];
      const k=pick(kinds);
      if(k==='calc') return calculQuestion(t);
      if(k==='mot')  return motQuestion(t);
      if(k==='forme')return formeQuestion();
      if(k==='intrus')return intrusQuestion(state.age);
      return quizQuestion(state.age);
    }
  });
}

/* --- générateurs extraits pour réutilisation dans le Cahier --- */
function calculQuestion(t){
  if(t==='petit'){
    const emo=pick(['🍎','🐶','⭐','🎈','🚗']); const n=randInt(1,6);
    let opts=new Set([n]); while(opts.size<3) opts.add(randInt(1,8));
    return {instruction:'Compte les objets 🔢',
      promptHTML:`<div class="prompt-box"><div style="font-size:36px">${emo.repeat(n)}</div></div>`,
      cols:'cols-3',options:[...opts].map(v=>({label:v,ok:v===n}))};
  }
  if(t==='moyen'){
    const a=randInt(1,15),b=randInt(1,10),good=a+b;
    let opts=new Set([good]); while(opts.size<4) opts.add(Math.max(0,good+randInt(-3,3)));
    return {instruction:'Combien font…',
      promptHTML:`<div class="prompt-box"><span class="txt">${a} + ${b} = ?</span></div>`,
      options:[...opts].map(v=>({label:v,ok:v===good}))};
  }
  const a=randInt(2,10),b=randInt(2,10),good=a*b;
  let opts=new Set([good]); while(opts.size<4) opts.add(good+randInt(-8,8));
  return {instruction:'Multiplication ✖️',
    promptHTML:`<div class="prompt-box"><span class="txt">${a} × ${b} = ?</span></div>`,
    options:[...opts].filter(v=>v>0).slice(0,4).map(v=>({label:v,ok:v===good}))};
}
function motQuestion(t){
  if(t==='petit'){
    const w=pick(MOTS); const good=w.mot[0];
    let letters=new Set([good]); const alpha='ABCDEFGHIJKLMNOPRSTU';
    while(letters.size<3) letters.add(alpha[rand(alpha.length)]);
    return {instruction:'Première lettre du mot ?',
      promptHTML:`<div class="prompt-box"><div class="big-emoji" style="margin:0">${w.emo}</div><div style="font-weight:800">${w.mot.toLowerCase()}</div></div>`,
      cols:'cols-3',options:[...letters].map(l=>({label:l,ok:l===good}))};
  }
  if(t==='moyen'){
    const w=pick(MOTS); const i=randInt(1,w.mot.length-1); const good=w.mot[i];
    const shown=w.mot.split('').map((c,k)=>k===i?'_':c).join('');
    let letters=new Set([good]); const alpha='ABCDEFGHILMNOPRSTUV';
    while(letters.size<4) letters.add(alpha[rand(alpha.length)]);
    return {instruction:'Quelle lettre manque ?',
      promptHTML:`<div class="prompt-box"><div style="font-size:38px">${w.emo}</div><span class="txt">${shown}</span></div>`,
      cols:'cols-4',options:[...letters].map(l=>({label:l,ok:l===good}))};
  }
  const o=pick(ORTHO);
  return {instruction:'Quel mot est bien écrit ?',cols:'cols-1',
    options:[{label:o.bon,ok:true},...o.faux.map(f=>({label:f,ok:false}))].slice(0,3),
    wrongMsg:'La bonne orthographe est en vert 👀'};
}
function formeQuestion(){
  const f=pick(FORMES); let opts=new Set([f[0]]);
  while(opts.size<3) opts.add(pick(FORMES)[0]);
  return {instruction:'Quelle est cette forme ?',
    promptHTML:`<div class="prompt-box"><div style="font-size:100px;color:var(--violet)">${f[1]}</div></div>`,
    cols:'cols-3',options:shuffle([...opts]).map(v=>({label:v,ok:v===f[0]}))};
}
function intrusQuestion(age){
  const count=age<=6?4:6;
  const s=pick(INTRUS_SETS);
  const goods=sample(s.good,count-1); const bad=pick(s.bad);
  const all=shuffle([...goods.map(e=>({label:e,ok:false})),{label:bad,ok:true}]);
  return {instruction:'Clique sur l\'intrus 👀',
    cols: count===4?'cols-2':'cols-3',options:all,
    wrongMsg:'L\'intrus était en vert 😉'};
}
function quizQuestion(age){
  const bank=QUIZ.filter(x=>x.min<=age); const x=pick(bank);
  return {instruction:x.q, small:true,
    cols:(x.a.length>10||x.b.some(v=>v.length>10))?'cols-1':'cols-2',
    options:[{label:x.a,ok:true},...x.b.map(v=>({label:v,ok:false}))],
    wrongMsg:'La bonne réponse est en vert 💡'};
}
